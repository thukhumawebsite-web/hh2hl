<script>
    let supabaseClient = null;
    let currentStepId = 'step1';
    let historyStack = ['step1'];
    let allPages = [];
    let currentEditButtons = [];

    // Admin Modal Controls
    function openAdminModal() {
      document.getElementById('adminModal').classList.remove('hidden');
    }
    function closeAdminModal() {
      document.getElementById('adminModal').classList.add('hidden');
    }

    function showError(msg) {
      const el = document.getElementById('errorBanner');
      if (el) {
        el.textContent = msg;
        el.classList.remove('hidden');
      }
      document.getElementById('pageTitle').textContent = "အချက်အလက်များကို ခေါ်ယူမရပါ";
    }

    async function initSystem() {
      try {
        const res = await fetch('/api/config');
        if (!res.ok) {
          throw new Error(`/api/config ဖိုင် မရှိပါ (Status: ${res.status})။`);
        }
        const config = await res.json();

        if (!config.supabaseUrl || !config.supabaseKey) {
          throw new Error("Vercel Settings တွင် SUPABASE_URL နှင့် SUPABASE_KEY မထည့်ရသေးပါ။");
        }

        // Variable နာမည်ကို supabaseClient သို့ ပြောင်းလဲထားခြင်း
        supabaseClient = window.supabase.createClient(config.supabaseUrl, config.supabaseKey);

        await fetchAllPagesList();
        await renderPage(currentStepId);
      } catch (err) {
        console.error("Initialization Error:", err);
        showError(err.message);
      }
    }

    async function fetchAllPagesList() {
      const { data, error } = await supabaseClient.from('pages').select('id, title');
      if (error) throw error;

      allPages = data || [];
      const select = document.getElementById('adminPageSelect');
      select.innerHTML = '';
      allPages.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.id;
        opt.textContent = `${p.id} - ${p.title}`;
        select.appendChild(opt);
      });
    }

    async function renderPage(pageId) {
      currentStepId = pageId;
      const { data: page, error } = await supabaseClient.from('pages').select('*').eq('id', pageId).single();
      
      if (error || !page) {
        document.getElementById('pageTitle').textContent = "Step Not Found";
        document.getElementById('pageDesc').textContent = `Step ID: '${pageId}' အတွက် Database တွင် အချက်အလက် မရှိပါ။`;
        document.getElementById('buttonsGrid').innerHTML = '';
        document.getElementById('videoSection').classList.add('hidden');
        return;
      }

      document.getElementById('pageTitle').textContent = page.title;
      document.getElementById('pageDesc').textContent = page.description || '';

      // Video Section
      const videoSec = document.getElementById('videoSection');
      const videoCont = document.getElementById('videoContainer');
      videoCont.innerHTML = '';

      if (page.video_url) {
        videoSec.classList.remove('hidden');
        if (page.video_url.endsWith('.mp4') || page.video_url.includes('telegabar.com')) {
          const video = document.createElement('video');
          video.src = page.video_url;
          video.controls = true;
          video.autoplay = true;
          video.muted = true;
          video.playsInline = true;
          video.className = "w-full h-full object-contain";
          videoCont.appendChild(video);
        } else {
          const iframe = document.createElement('iframe');
          iframe.src = page.video_url + "?autoplay=1&mute=1";
          iframe.className = "w-full h-full border-0";
          iframe.allow = "autoplay; encrypted-media";
          videoCont.appendChild(iframe);
        }
      } else {
        videoSec.classList.add('hidden');
      }

      // Buttons Section
      const { data: buttons } = await supabaseClient.from('buttons').select('*').eq('page_id', pageId).order('order_index');
      const grid = document.getElementById('buttonsGrid');
      grid.innerHTML = '';

      (buttons || []).forEach(btn => {
        const card = document.createElement('div');
        card.onclick = () => navigateTo(btn.target_step);
        card.className = "bg-trade-card border border-trade-border hover:border-blue-500/60 rounded-2xl p-4 cursor-pointer transition-all duration-200 transform hover:-translate-y-1 flex flex-col justify-between group shadow-lg";

        const badgeColor = btn.tag_color === 'green' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' :
                           btn.tag_color === 'red' ? 'bg-rose-500/10 text-rose-400 border-rose-500/20' :
                           'bg-blue-500/10 text-blue-400 border-blue-500/20';

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="text-[10px] font-bold px-2 py-0.5 rounded-full border ${badgeColor}">${btn.tag || 'OPTION'}</span>
              <span class="text-slate-500 group-hover:text-blue-400 transition text-sm">↗</span>
            </div>
            <h3 class="font-bold text-lg text-slate-100 mb-1 group-hover:text-blue-400 transition">${btn.label}</h3>
            <p class="text-xs text-slate-400 mb-3">${btn.subtitle || ''}</p>
          </div>
          ${btn.image_url ? `
            <div class="w-full h-36 bg-slate-950/80 border border-trade-border rounded-xl p-2 flex items-center justify-center overflow-hidden">
              <img src="${btn.image_url}" class="max-h-full max-w-full object-contain">
            </div>
          ` : ''}
        `;
        grid.appendChild(card);
      });

      renderBreadcrumbs();
    }

    function navigateTo(stepId) {
      if (historyStack[historyStack.length - 1] !== stepId) {
        historyStack.push(stepId);
      }
      renderPage(stepId);
    }

    function renderBreadcrumbs() {
      const bc = document.getElementById('breadcrumbs');
      bc.innerHTML = '';
      historyStack.forEach((step, idx) => {
        const item = document.createElement('span');
        item.className = `cursor-pointer ${idx === historyStack.length - 1 ? 'text-blue-400 font-bold' : 'hover:text-slate-200'}`;
        item.textContent = step;
        item.onclick = () => {
          historyStack = historyStack.slice(0, idx + 1);
          renderPage(step);
        };
        bc.appendChild(item);
        if (idx < historyStack.length - 1) {
          const sep = document.createElement('span');
          sep.textContent = '>';
          sep.className = 'text-slate-600';
          bc.appendChild(sep);
        }
      });
    }

    async function verifyAdmin() {
      const pass = document.getElementById('adminPassInput').value;
      const errEl = document.getElementById('adminAuthErr');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pass })
        });
        const data = await res.json();

        if (data.success) {
          errEl.classList.add('hidden');
          document.getElementById('adminAuthSection').classList.add('hidden');
          document.getElementById('adminContentSection').classList.remove('hidden');
          document.getElementById('adminFooter').classList.remove('hidden');
          loadPageForEdit();
        } else {
          errEl.classList.remove('hidden');
        }
      } catch (e) {
        if (pass === '123456') {
          document.getElementById('adminAuthSection').classList.add('hidden');
          document.getElementById('adminContentSection').classList.remove('hidden');
          document.getElementById('adminFooter').classList.remove('hidden');
          loadPageForEdit();
        } else {
          alert("Admin Password မှားယွင်းနေပါသည်။");
        }
      }
    }

    async function addNewPagePrompt() {
      const pageId = prompt("Page ID အသစ် ရိုက်ထည့်ပါ (ဥပမာ- step3_entry):");
      if (!pageId) return;
      const formattedId = pageId.trim().toLowerCase().replace(/\s+/g, '_');
      const title = prompt("Page Title ထည့်ပါ:") || "New Step";

      const { error } = await supabaseClient.from('pages').insert([{
        id: formattedId,
        title: title,
        description: '',
        video_url: ''
      }]);

      if (error) {
        alert("Error: " + error.message);
        return;
      }

      await fetchAllPagesList();
      document.getElementById('adminPageSelect').value = formattedId;
      loadPageForEdit();
    }

    async function loadPageForEdit() {
      const pageId = document.getElementById('adminPageSelect').value;
      if (!pageId) return;

      const { data: page } = await supabaseClient.from('pages').select('*').eq('id', pageId).single();
      if (!page) return;

      document.getElementById('editPageTitle').value = page.title || '';
      document.getElementById('editPageDesc').value = page.description || '';
      document.getElementById('editPageVideo').value = page.video_url || '';

      const { data: buttons } = await supabaseClient.from('buttons').select('*').eq('page_id', pageId).order('order_index');
      currentEditButtons = buttons || [];
      renderAdminButtons();
    }

    function renderAdminButtons() {
      const container = document.getElementById('adminButtonsList');
      container.innerHTML = '';

      currentEditButtons.forEach((btn, i) => {
        const div = document.createElement('div');
        div.className = "bg-slate-900 border border-trade-border rounded-xl p-3 text-xs space-y-2 relative";
        div.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="text-blue-400 font-bold">Button #${i + 1}</span>
            <button type="button" onclick="removeButton(${i})" class="text-red-400 hover:text-red-300">🗑️ Delete</button>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <input type="text" value="${btn.label || ''}" placeholder="Button Label" oninput="currentEditButtons[${i}].label = this.value" class="bg-slate-950 border border-trade-border rounded p-1.5 text-white">
            <input type="text" value="${btn.target_step || ''}" placeholder="Target Page ID" oninput="currentEditButtons[${i}].target_step = this.value" class="bg-slate-950 border border-trade-border rounded p-1.5 text-white">
          </div>
          <input type="text" value="${btn.subtitle || ''}" placeholder="Subtitle" oninput="currentEditButtons[${i}].subtitle = this.value" class="w-full bg-slate-950 border border-trade-border rounded p-1.5 text-white">
          <input type="text" value="${btn.image_url || ''}" placeholder="Image URL" oninput="currentEditButtons[${i}].image_url = this.value" class="w-full bg-slate-950 border border-trade-border rounded p-1.5 text-white">
        `;
        container.appendChild(div);
      });
    }

    function addNewButtonField() {
      currentEditButtons.push({
        label: 'Option အသစ်',
        subtitle: '',
        target_step: 'step1',
        tag: 'OPTION',
        tag_color: 'blue',
        image_url: ''
      });
      renderAdminButtons();
    }

    function removeButton(index) {
      currentEditButtons.splice(index, 1);
      renderAdminButtons();
    }

    async function saveChangesToSupabase() {
      const pageId = document.getElementById('adminPageSelect').value;
      const title = document.getElementById('editPageTitle').value;
      const description = document.getElementById('editPageDesc').value;
      const video_url = document.getElementById('editPageVideo').value;
      const saveBtn = document.getElementById('saveBtn');

      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';

      try {
        await supabaseClient.from('pages').update({ title, description, video_url }).eq('id', pageId);
        await supabaseClient.from('buttons').delete().eq('page_id', pageId);

        if (currentEditButtons.length > 0) {
          const toInsert = currentEditButtons.map((b, idx) => ({
            page_id: pageId,
            label: b.label,
            subtitle: b.subtitle,
            tag: b.tag || 'OPTION',
            tag_color: b.tag_color || 'blue',
            target_step: b.target_step,
            image_url: b.image_url,
            order_index: idx
          }));
          await supabaseClient.from('buttons').insert(toInsert);
        }

        alert('အောင်မြင်စွာ သိမ်းဆည်းပြီးပါပြီ!');
        await fetchAllPagesList();
        if (currentStepId === pageId) renderPage(pageId);
      } catch (err) {
        alert("Save Error: " + err.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save All Changes';
      }
    }

    window.addEventListener('DOMContentLoaded', initSystem);
  </script>
