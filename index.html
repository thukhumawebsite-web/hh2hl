<!DOCTYPE html>
<html lang="my" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trading Decision Flow</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            trade: {
              bg: '#0b0f19',
              card: '#151c2c',
              border: '#232e47',
              accent: '#3b82f6',
              bull: '#10b981',
              bear: '#ef4444'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="min-h-screen bg-trade-bg text-slate-100 flex flex-col justify-between selection:bg-blue-600 selection:text-white">

  <!-- HEADER -->
  <header class="border-b border-trade-border bg-slate-950/60 backdrop-blur-md sticky top-0 z-30 px-4 py-3">
    <div class="max-w-6xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-3 cursor-pointer" onclick="navigateTo('step1')">
        <div class="w-10 h-10 rounded-xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 font-bold">
          📈
        </div>
        <div>
          <h1 class="font-bold text-base leading-tight tracking-wide">TRADING DECISION FLOW</h1>
          <p class="text-xs text-slate-400">Step-by-Step Dynamic Entry Checklist System</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="openAdminModal()" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs rounded-lg border border-trade-border flex items-center gap-1.5 transition">
          <span>⚙️</span>
          <span>Admin</span>
        </button>
        <button onclick="navigateTo('step1')" class="p-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg border border-trade-border transition" title="Reset Flow">
          🔄
        </button>
      </div>
    </div>
  </header>

  <!-- MAIN CONTENT CONTAINER -->
  <main class="max-w-6xl mx-auto w-full p-4 flex-1">
    <!-- Breadcrumbs Navigation -->
    <nav id="breadcrumbs" class="flex items-center gap-2 text-xs text-slate-400 mb-4 overflow-x-auto py-1"></nav>

    <!-- Page Title & Description -->
    <div class="mb-6 text-center max-w-2xl mx-auto">
      <h2 id="pageTitle" class="text-2xl font-bold text-slate-100 mb-1">Loading...</h2>
      <p id="pageDesc" class="text-sm text-slate-400"></p>
    </div>

    <!-- Video Container -->
    <div id="videoSection" class="mb-8 max-w-3xl mx-auto hidden">
      <div class="bg-black/80 border border-trade-border rounded-2xl overflow-hidden shadow-xl aspect-video relative">
        <div id="videoContainer" class="w-full h-full"></div>
      </div>
    </div>

    <!-- Dynamic Buttons Grid -->
    <div id="buttonsGrid" class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8"></div>
  </main>

  <!-- FOOTER -->
  <footer class="border-t border-trade-border py-4 text-center text-xs text-slate-500 bg-slate-950/40">
    <p>Trading Entry Guide &copy; 2026. Dynamic Flow System with Supabase.</p>
  </footer>

  <!-- ADMIN MANAGEMENT MODAL -->
  <div id="adminModal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-trade-card border border-trade-border rounded-2xl max-w-2xl w-full max-h-[90vh] flex flex-col shadow-2xl">
      
      <!-- Modal Header -->
      <div class="p-4 border-b border-trade-border flex justify-between items-center">
        <h3 class="font-bold text-lg flex items-center gap-2"><span>⚙️</span> Admin Management Panel</h3>
        <button onclick="closeAdminModal()" class="text-slate-400 hover:text-white text-lg">✕</button>
      </div>

      <!-- Password Verification Section -->
      <div id="adminAuthSection" class="p-6 text-center">
        <p class="text-slate-300 text-sm mb-4">Admin Panel သို့ဝင်ရောက်ရန် Password ဖြည့်ပါ။</p>
        <input type="password" id="adminPassInput" class="w-full max-w-xs bg-slate-900 border border-trade-border rounded-xl px-4 py-2.5 text-sm mb-4 focus:outline-none focus:border-blue-500 text-center" placeholder="Enter Admin Password">
        <br>
        <button onclick="verifyAdmin()" class="bg-blue-600 hover:bg-blue-500 text-white text-sm px-6 py-2.5 rounded-xl font-medium transition">Login Admin</button>
        <p id="adminAuthErr" class="text-red-400 text-xs mt-2 hidden">Password မှားယွင်းနေပါသည်။</p>
      </div>

      <!-- Admin Management Section -->
      <div id="adminContentSection" class="p-6 overflow-y-auto space-y-6 flex-1 hidden">
        <div>
          <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Select or Add Page</label>
          <div class="flex gap-2">
            <select id="adminPageSelect" onchange="loadPageForEdit()" class="flex-1 bg-slate-900 border border-trade-border rounded-xl px-3 py-2 text-sm text-white focus:outline-none"></select>
            <button onclick="addNewPagePrompt()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 text-xs rounded-xl font-medium transition">
              + New Page
            </button>
          </div>
        </div>

        <div class="space-y-3">
          <div>
            <label class="block text-xs text-slate-400 mb-1">Page Title</label>
            <input type="text" id="editPageTitle" class="w-full bg-slate-900 border border-trade-border rounded-xl px-3 py-2 text-sm text-white">
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Page Description</label>
            <textarea id="editPageDesc" rows="2" class="w-full bg-slate-900 border border-trade-border rounded-xl px-3 py-2 text-sm text-white"></textarea>
          </div>
          <div>
            <label class="block text-xs text-slate-400 mb-1">Video URL (MP4 Link or Embed)</label>
            <input type="text" id="editPageVideo" class="w-full bg-slate-900 border border-trade-border rounded-xl px-3 py-2 text-sm text-white">
          </div>
        </div>

        <!-- Action Buttons Configuration -->
        <div class="border-t border-trade-border pt-4">
          <div class="flex justify-between items-center mb-3">
            <h4 class="font-semibold text-sm">Action Buttons / Options</h4>
            <button onclick="addNewButtonField()" class="text-xs bg-blue-600/20 border border-blue-500/40 text-blue-400 hover:bg-blue-600/30 px-3 py-1 rounded-lg">
              + Add Button
            </button>
          </div>
          <div id="adminButtonsList" class="space-y-3"></div>
        </div>
      </div>

      <!-- Modal Footer -->
      <div id="adminFooter" class="p-4 border-t border-trade-border flex justify-end gap-2 bg-slate-950/50 hidden">
        <button onclick="saveChangesToSupabase()" id="saveBtn" class="px-5 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold rounded-xl transition flex items-center gap-2">
          <span>💾</span>
          <span>Save All Changes</span>
        </button>
      </div>

    </div>
  </div>

  <script>
    let supabase = null;
    let currentStepId = 'step1';
    let historyStack = ['step1'];
    let allPages = [];
    let currentEditButtons = [];

    // ၁။ စနစ်စတင်ခြင်း (Vercel API မှ Config ဆွဲယူပြီး Supabase ချိတ်ဆက်ခြင်း)
    async function initSystem() {
      try {
        const res = await fetch('/api/config');
        const config = await res.json();

        if (!config.supabaseUrl || !config.supabaseKey) {
          document.getElementById('pageTitle').textContent = "Configuration Error";
          document.getElementById('pageDesc').textContent = "Vercel Environment Variables များတွင် SUPABASE_URL နှင့် SUPABASE_KEY မထည့်ရသေးပါ။";
          return;
        }

        // Initialize Supabase Client
        supabase = window.supabase.createClient(config.supabaseUrl, config.supabaseKey);

        await fetchAllPagesList();
        await renderPage(currentStepId);
      } catch (err) {
        console.error("Config Error:", err);
        document.getElementById('pageTitle').textContent = "Connection Failed";
        document.getElementById('pageDesc').textContent = "API သို့ ဆက်သွယ်၍ မရနိုင်ပါ။ Vercel API Route ဖိုင်များကို စစ်ဆေးပါ။";
      }
    }

    // ၂။ Page အားလုံး စာရင်းဆွဲယူခြင်း
    async function fetchAllPagesList() {
      const { data, error } = await supabase.from('pages').select('id, title');
      if (!error && data) {
        allPages = data;
        const select = document.getElementById('adminPageSelect');
        select.innerHTML = '';
        allPages.forEach(p => {
          const opt = document.createElement('option');
          opt.value = p.id;
          opt.textContent = `${p.id} - ${p.title}`;
          select.appendChild(opt);
        });
      }
    }

    // ၃။ Current Page နှင့် Buttons များကို Render ပြုလုပ်ခြင်း
    async function renderPage(pageId) {
      currentStepId = pageId;
      const { data: page, error } = await supabase.from('pages').select('*').eq('id', pageId).single();
      
      if (error || !page) {
        document.getElementById('pageTitle').textContent = "Page Not Found";
        document.getElementById('pageDesc').textContent = `Page ID '${pageId}' ကို ရှာမတွေ့ပါ။`;
        document.getElementById('buttonsGrid').innerHTML = '';
        document.getElementById('videoSection').classList.add('hidden');
        return;
      }

      document.getElementById('pageTitle').textContent = page.title;
      document.getElementById('pageDesc').textContent = page.description || '';

      // Video Section
      const videoSec = document.getElementById('videoSection');
      const videoCont = document.getElementById('videoContainer');
      videoCont.innerHTML = '';

      if (page.video_url) {
        videoSec.classList.remove('hidden');
        if (page.video_url.endsWith('.mp4') || page.video_url.includes('telegabar.com')) {
          const video = document.createElement('video');
          video.src = page.video_url;
          video.controls = true;
          video.autoplay = true;
          video.muted = true;
          video.playsInline = true;
          video.className = "w-full h-full object-contain";
          videoCont.appendChild(video);
        } else {
          const iframe = document.createElement('iframe');
          iframe.src = page.video_url + "?autoplay=1&mute=1";
          iframe.className = "w-full h-full border-0";
          iframe.allow = "autoplay; encrypted-media";
          videoCont.appendChild(iframe);
        }
      } else {
        videoSec.classList.add('hidden');
      }

      // Buttons Section
      const { data: buttons } = await supabase.from('buttons').select('*').eq('page_id', pageId).order('order_index');
      const grid = document.getElementById('buttonsGrid');
      grid.innerHTML = '';

      (buttons || []).forEach(btn => {
        const card = document.createElement('div');
        card.onclick = () => navigateTo(btn.target_step);
        card.className = "bg-trade-card border border-trade-border hover:border-blue-500/60 rounded-2xl p-4 cursor-pointer transition-all duration-200 transform hover:-translate-y-1 flex flex-col justify-between group shadow-lg";

        const badgeColor = btn.tag_color === 'green' ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' :
                           btn.tag_color === 'red' ? 'bg-rose-500/10 text-rose-400 border-rose-500/20' :
                           btn.tag_color === 'amber' ? 'bg-amber-500/10 text-amber-400 border-amber-500/20' :
                           'bg-blue-500/10 text-blue-400 border-blue-500/20';

        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="text-[10px] font-bold px-2 py-0.5 rounded-full border ${badgeColor}">${btn.tag || 'OPTION'}</span>
              <span class="text-slate-500 group-hover:text-blue-400 transition text-sm">↗</span>
            </div>
            <h3 class="font-bold text-lg text-slate-100 mb-1 group-hover:text-blue-400 transition">${btn.label}</h3>
            <p class="text-xs text-slate-400 mb-3">${btn.subtitle || ''}</p>
          </div>
          ${btn.image_url ? `
            <div class="w-full h-36 bg-slate-950/80 border border-trade-border rounded-xl p-2 flex items-center justify-center overflow-hidden">
              <img src="${btn.image_url}" class="max-h-full max-w-full object-contain">
            </div>
          ` : ''}
        `;
        grid.appendChild(card);
      });

      renderBreadcrumbs();
    }

    // ၄။ Breadcrumbs ခြေရာကောက်ပြသခြင်း
    function navigateTo(stepId) {
      if (historyStack[historyStack.length - 1] !== stepId) {
        historyStack.push(stepId);
      }
      renderPage(stepId);
    }

    function renderBreadcrumbs() {
      const bc = document.getElementById('breadcrumbs');
      bc.innerHTML = '';
      historyStack.forEach((step, idx) => {
        const item = document.createElement('span');
        item.className = `cursor-pointer ${idx === historyStack.length - 1 ? 'text-blue-400 font-bold' : 'hover:text-slate-200'}`;
        item.textContent = step;
        item.onclick = () => {
          historyStack = historyStack.slice(0, idx + 1);
          renderPage(step);
        };
        bc.appendChild(item);
        if (idx < historyStack.length - 1) {
          const sep = document.createElement('span');
          sep.textContent = '>';
          sep.className = 'text-slate-600';
          bc.appendChild(sep);
        }
      });
    }

    // ၅။ ADMIN စနစ် Logic များ
    function openAdminModal() {
      document.getElementById('adminModal').classList.remove('hidden');
    }
    
    function closeAdminModal() {
      document.getElementById('adminModal').classList.add('hidden');
    }

    async function verifyAdmin() {
      const pass = document.getElementById('adminPassInput').value;
      const errEl = document.getElementById('adminAuthErr');

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pass })
        });
        const data = await res.json();

        if (data.success) {
          errEl.classList.add('hidden');
          document.getElementById('adminAuthSection').classList.add('hidden');
          document.getElementById('adminContentSection').classList.remove('hidden');
          document.getElementById('adminFooter').classList.remove('hidden');
          loadPageForEdit();
        } else {
          errEl.classList.remove('hidden');
        }
      } catch (err) {
        alert("Login စစ်ဆေးရာတွင် Error ဖြစ်ပေါ်နေပါသည်။");
      }
    }

    async function addNewPagePrompt() {
      const pageId = prompt("Page ID အသစ် ရိုက်ထည့်ပါ (ဥပမာ- step3_entry):");
      if (!pageId) return;
      const formattedId = pageId.trim().toLowerCase().replace(/\s+/g, '_');

      const title = prompt("Page Title ထည့်ပါ:") || "Untitled Step";

      const { error } = await supabase.from('pages').insert([{
        id: formattedId,
        title: title,
        description: '',
        video_url: ''
      }]);

      if (error) {
        alert("Error: " + error.message);
        return;
      }

      await fetchAllPagesList();
      document.getElementById('adminPageSelect').value = formattedId;
      loadPageForEdit();
    }

    async function loadPageForEdit() {
      const pageId = document.getElementById('adminPageSelect').value;
      if (!pageId) return;

      const { data: page } = await supabase.from('pages').select('*').eq('id', pageId).single();
      if (!page) return;

      document.getElementById('editPageTitle').value = page.title || '';
      document.getElementById('editPageDesc').value = page.description || '';
      document.getElementById('editPageVideo').value = page.video_url || '';

      const { data: buttons } = await supabase.from('buttons').select('*').eq('page_id', pageId).order('order_index');
      currentEditButtons = buttons || [];
      renderAdminButtons();
    }

    function renderAdminButtons() {
      const container = document.getElementById('adminButtonsList');
      container.innerHTML = '';

      currentEditButtons.forEach((btn, i) => {
        const div = document.createElement('div');
        div.className = "bg-slate-900 border border-trade-border rounded-xl p-3 text-xs space-y-2 relative";
        div.innerHTML = `
          <div class="flex justify-between items-center">
            <span class="text-blue-400 font-bold">Button #${i + 1}</span>
            <button onclick="removeButton(${i})" class="text-red-400 hover:text-red-300">🗑️ Delete</button>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <input type="text" value="${btn.label || ''}" placeholder="Button Label (e.g. Next Step)" oninput="currentEditButtons[${i}].label = this.value" class="bg-slate-950 border border-trade-border rounded p-1.5 text-white">
            <input type="text" value="${btn.target_step || ''}" placeholder="Target Page ID (Next Step ID)" oninput="currentEditButtons[${i}].target_step = this.value" class="bg-slate-950 border border-trade-border rounded p-1.5 text-white">
          </div>
          <div class="grid grid-cols-2 gap-2">
            <input type="text" value="${btn.tag || ''}" placeholder="Tag (e.g. UPTREND)" oninput="currentEditButtons[${i}].tag = this.value" class="bg-slate-950 border border-trade-border rounded p-1.5 text-white">
            <select onchange="currentEditButtons[${i}].tag_color = this.value" class="bg-slate-950 border border-trade-border rounded p-1.5 text-white">
              <option value="blue" ${btn.tag_color === 'blue' ? 'selected' : ''}>Blue Tag</option>
              <option value="green" ${btn.tag_color === 'green' ? 'selected' : ''}>Green Tag</option>
              <option value="red" ${btn.tag_color === 'red' ? 'selected' : ''}>Red Tag</option>
              <option value="amber" ${btn.tag_color === 'amber' ? 'selected' : ''}>Amber Tag</option>
            </select>
          </div>
          <input type="text" value="${btn.subtitle || ''}" placeholder="Subtitle description" oninput="currentEditButtons[${i}].subtitle = this.value" class="w-full bg-slate-950 border border-trade-border rounded p-1.5 text-white">
          <input type="text" value="${btn.image_url || ''}" placeholder="Image URL (Optional)" oninput="currentEditButtons[${i}].image_url = this.value" class="w-full bg-slate-950 border border-trade-border rounded p-1.5 text-white">
        `;
        container.appendChild(div);
      });
    }

    function addNewButtonField() {
      currentEditButtons.push({
        label: 'Option အသစ်',
        subtitle: '',
        target_step: 'step1',
        tag: 'OPTION',
        tag_color: 'blue',
        image_url: ''
      });
      renderAdminButtons();
    }

    function removeButton(index) {
      currentEditButtons.splice(index, 1);
      renderAdminButtons();
    }

    async function saveChangesToSupabase() {
      const pageId = document.getElementById('adminPageSelect').value;
      const title = document.getElementById('editPageTitle').value;
      const description = document.getElementById('editPageDesc').value;
      const video_url = document.getElementById('editPageVideo').value;
      const saveBtn = document.getElementById('saveBtn');

      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving...';

      try {
        // Update Page Metadata
        await supabase.from('pages').update({ title, description, video_url }).eq('id', pageId);

        // Delete existing buttons for this page
        await supabase.from('buttons').delete().eq('page_id', pageId);

        // Insert new / updated buttons
        if (currentEditButtons.length > 0) {
          const toInsert = currentEditButtons.map((b, idx) => ({
            page_id: pageId,
            label: b.label,
            subtitle: b.subtitle,
            tag: b.tag || 'OPTION',
            tag_color: b.tag_color || 'blue',
            target_step: b.target_step,
            image_url: b.image_url,
            order_index: idx
          }));
          await supabase.from('buttons').insert(toInsert);
        }

        alert('အချက်အလက်အားလုံး အောင်မြင်စွာ သိမ်းဆည်းပြီးပါပြီ!');
        await fetchAllPagesList();
        if (currentStepId === pageId) renderPage(pageId);
      } catch (err) {
        alert("သိမ်းဆည်းရာတွင် Error ဖြစ်ပေါ်ခဲ့သည်: " + err.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerHTML = '<span>💾</span><span>Save All Changes</span>';
      }
    }

    window.onload = initSystem;
  </script>
</body>
</html>
